version: '3.9'

services:

  api:
    build: .
    container_name: ai_recommendation_api

    ports:
      - "8001:8000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_course_recommendation

  db:
    image: postgres:15

    container_name: ai_recommendation_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_course_recommendation

    ports:
      - "5432:5432"